#bg{position:fixed;inset:0;z-index:-1;background:var(--img) center/cover no-repeat;filter:grayscale(var(--g)) brightness(calc(1 - var(--g) * .15));transition:filter 1s}
body.inner #bg{filter:grayscale(var(--g)) blur(3px) brightness(calc(.97 - var(--g) * .15));transform:scale(1.06)}
.home-card .tetes{width:96px;display:block;margin:0 auto 4px}
.hero{width:100%;aspect-ratio:1672/941;max-height:calc(100vh - 340px);background:var(--img) center/contain no-repeat;filter:drop-shadow(0 8px 18px rgba(0,40,80,.45))}
body.map #bg,body.home #bg{background:radial-gradient(circle at 18% 14%,rgba(255,255,255,.35) 0 5%,transparent 5.5%),radial-gradient(circle at 82% 26%,rgba(255,255,255,.28) 0 4%,transparent 4.5%),radial-gradient(circle at 64% 78%,rgba(255,255,255,.22) 0 7%,transparent 7.5%),radial-gradient(circle at 28% 70%,rgba(255,255,255,.2) 0 3%,transparent 3.5%),linear-gradient(180deg,#4fc3f7 0%,#1e88e5 55%,#0d47a1 100%);filter:none;transform:none}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:16px;min-height:50px;padding:10px 22px;font-weight:800;color:#fff;background:linear-gradient(#42a5f5,#1e88e5);box-shadow:0 5px 0 #0d47a1,0 8px 14px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d47a1}
.btn.hijau{background:linear-gradient(#66bb6a,#43a047);box-shadow:0 5px 0 #1b5e20,0 8px 14px rgba(0,0,0,.2)}
.btn.kuning{background:linear-gradient(#ffd54f,#ffb300);color:#4e342e;box-shadow:0 5px 0 #e65100,0 8px 14px rgba(0,0,0,.2)}
.btn.abu{background:linear-gradient(#cfd8dc,#b0bec5);color:#263238;box-shadow:0 5px 0 #78909c}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.btn.pulse:not(:disabled){animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.topbar{display:none;position:sticky;top:0;z-index:20;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-bottom:3px solid #4fc3f7}
body.inner .topbar{display:flex}
.topbar .ibtn{border:0;background:#e3f2fd;border-radius:12px;min-width:46px;height:46px;font-size:22px;box-shadow:0 3px 0 #90caf9}
.meter{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.mbar{flex:1;height:20px;background:#cfd8dc;border-radius:12px;overflow:hidden;border:2px solid #0277bd}
#mfill{height:100%;width:20%;background:linear-gradient(90deg,#4fc3f7,#0288d1);transition:width .8s}
#ttl{font-weight:800;flex:1 1 100%;order:5;text-align:center;font-size:15px;color:var(--biru2)}
@media(min-width:760px){#ttl{flex:0 1 auto;order:0}}
#app{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.card{background:rgba(255,255,255,.94);border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(0,50,90,.25);border:3px solid #fff;margin-bottom:14px}
h1,h2,h3{margin:.2em 0;color:var(--biru2)}
h2{font-size:1.35em}
p{line-height:1.5;margin:.5em 0}
.home-wrap{min-height:calc(100vh - 56px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.home-card{width:min(560px,100%);text-align:center;background:rgba(255,255,255,.82);backdrop-filter:blur(4px);border-radius:26px;padding:16px 16px 18px;border:3px solid #fff;box-shadow:0 10px 28px rgba(0,60,100,.35)}
.home-card h1{font-size:1.45em;line-height:1.2}
.home-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.home-btns .btn.big{font-size:1.25em;padding:12px 34px}
.guide{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.tetes{width:68px;flex:none;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.bubble{position:relative;background:#fff;border:3px solid #4fc3f7;border-radius:18px;padding:10px 14px;flex:1;line-height:1.45;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border:9px solid transparent;border-right:12px solid #4fc3f7;border-left:0}
.zhead{display:flex;align-items:center;gap:12px}
.zicon{font-size:42px}
.zhead small{color:#37627f}
.zbody{min-height:200px}
.zfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#b0bec5}
.dots i.on{background:#1e88e5;transform:scale(1.3)}
.dots i.dn{background:#43a047}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.info{background:#e3f2fd;border-radius:18px;padding:12px 14px;border:2px solid #90caf9}
.info b.t{display:block;font-size:1.05em;color:var(--biru2)}
.info .em{font-size:34px}
.info.hj{background:#e8f5e9;border-color:#a5d6a7}
.info.ku{background:#fff8e1;border-color:#ffe082}
.qt{font-weight:800;font-size:1.05em}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt{background:#fff;border:3px solid #90caf9;border-radius:16px;padding:12px 14px;text-align:left;min-height:54px;color:var(--teks);font-weight:600;box-shadow:0 3px 0 #bbdefb}
.opt:hover:not(:disabled){background:#e3f2fd}
.opt.right{background:#c8e6c9;border-color:#43a047}
.opt.wrong{background:#ffcdd2;border-color:#e53935;animation:shake .4s}
.opt.sel{background:#fff59d;border-color:#fbc02d}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 14px;border-radius:14px;line-height:1.45;font-weight:600}
.fb.ok{background:#e8f5e9;border:2px solid #66bb6a}
.fb.no{background:#ffebee;border:2px solid #ef9a9a}
.explain{margin-top:12px;background:#fffde7;border:2px dashed #fbc02d;border-radius:16px;padding:10px 14px;line-height:1.5}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .4s}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:flex;flex-direction:column;gap:8px}
.mi{background:#fff;border:3px solid #90caf9;border-radius:14px;padding:10px;min-height:56px;font-weight:600;color:var(--teks);text-align:left;font-size:.92em}
.mi.sel{background:#fff59d;border-color:#fbc02d}
.mi.lock{background:#c8e6c9;border-color:#43a047;cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;background:#e1f5fe;border-radius:16px;border:2px dashed #4fc3f7;margin:8px 0}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:3px solid #29b6f6;border-radius:14px;padding:8px 12px;font-weight:700;cursor:grab;box-shadow:0 3px 0 #81d4fa}
.chip.sel{background:#fff59d;border-color:#fbc02d}
.chip.drag{opacity:.3}
.chip.placed{cursor:default;background:#c8e6c9;border-color:#43a047;box-shadow:none;font-size:.88em;padding:6px 10px}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);box-shadow:0 10px 20px rgba(0,0,0,.3)}
.bins{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.bin{background:#f1f8e9;border:3px dashed #7cb342;border-radius:18px;padding:8px;min-height:150px}
.bin .bt{text-align:center;font-weight:800;color:#33691e;margin-bottom:6px}
.bin .bc{display:flex;flex-direction:column;gap:6px}
.bin:hover{background:#dcedc8}
.slots{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;border:3px dashed #90caf9;border-radius:14px;padding:6px 10px;background:#f5fbff}
.slot b{width:32px;height:32px;border-radius:50%;background:#1e88e5;color:#fff;display:grid;place-items:center;flex:none}
.slot.fill{border-style:solid;border-color:#43a047;background:#e8f5e9}
.scene{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#81d4fa 0%,#e1f5fe 55%,#4fc3f7 55%,#0288d1 100%);padding:14px}
.hots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hot{background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:18px;padding:10px 4px;font-size:34px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.hot small{display:block;font-size:12px;font-weight:700;color:var(--teks);margin-top:4px}
.hot.seen{background:#c8e6c9;border-color:#43a047}
.detail{margin-top:10px;background:#fff;border-radius:14px;padding:10px 14px;font-weight:600;min-height:62px}
.simsvg{width:100%;border-radius:18px;border:3px solid #4fc3f7;display:block}
.bb{animation:rise 3s linear infinite;transform-box:fill-box;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-100px);opacity:0}}
.rays{transform-origin:340px 45px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=range]{width:100%;height:34px;accent-color:#ff9800}
.jars{display:flex;gap:16px;justify-content:center;margin:10px 0}
.jarbox{text-align:center;font-weight:700;font-size:.9em}
.jar{position:relative;width:96px;height:130px;border:4px solid #546e7a;border-top:0;border-radius:0 0 20px 20px;background:#fff;overflow:hidden;margin:4px auto}
.jar .w{position:absolute;bottom:0;left:0;right:0;height:80%;background:linear-gradient(#4fc3f7,#0288d1);transition:height 3.5s linear}
.trail{position:relative;display:flex;justify-content:space-between;margin:16px 6px 30px;padding-top:6px}
.trail::before{content:"";position:absolute;left:8%;right:8%;top:36px;border-top:5px dotted #4fc3f7}
.tn{position:relative;text-align:center;font-size:30px;width:16%;opacity:.45;transition:.5s}
.tn small{display:block;font-size:11px;font-weight:800;color:var(--teks)}
.tn.on{opacity:1;transform:scale(1.2)}
.marker{position:absolute;top:-10px;font-size:22px;transition:left 1s;transform:translateX(-50%)}
.bars{display:flex;height:40px;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);margin:8px 0}
.bars div{display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85em;transition:width .4s;white-space:nowrap;overflow:hidden}
.scn{font-size:36px;text-align:center;background:#e3f2fd;border-radius:16px;padding:10px;margin:8px 0;letter-spacing:6px}
.scn.bad{background:#ffe0b2}
.scn.good{background:#c8e6c9}
.phase{font-size:.8em;font-weight:800;color:#fff;background:#1e88e5;border-radius:12px;padding:3px 12px;display:inline-block}
.map{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.nrow{display:flex;align-items:center;gap:12px}
.nrow:nth-child(even){flex-direction:row-reverse;text-align:right}
.node{width:92px;height:92px;flex:none;border-radius:50%;border:5px solid #fff;font-size:40px;display:grid;place-items:center;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 6px 0 #1b5e20,0 10px 16px rgba(0,0,0,.25);position:relative}
.node.lock{background:linear-gradient(#b0bec5,#78909c);box-shadow:0 6px 0 #455a64;cursor:not-allowed}
.node.dn{background:linear-gradient(#ffd54f,#ffa000);box-shadow:0 6px 0 #e65100}
.node .stars{position:absolute;bottom:-14px;font-size:15px;background:#fff;border-radius:10px;padding:0 6px}
.nrow .nt{flex:1;background:rgba(255,255,255,.9);border-radius:16px;padding:8px 12px;border:2px solid #fff}
.nrow .nt b{color:var(--biru2)}
.nrow .nt small{display:block;color:#456}
.prog{height:22px;background:#cfd8dc;border-radius:14px;overflow:hidden;border:3px solid #fff;margin:6px 0}
.prog div{height:100%;background:linear-gradient(90deg,#66bb6a,#fdd835);transition:width .8s}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,40,70,.6);display:grid;place-items:center;padding:14px}
.modal .box{background:#fff;border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;border:4px solid #4fc3f7}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badge{text-align:center;background:#fff8e1;border:3px solid #ffd54f;border-radius:18px;padding:10px;font-weight:700;font-size:.9em}
.badge.off{filter:grayscale(1);opacity:.45}
.badge .bi{font-size:44px}
.bigbadge{font-size:90px;animation:pop .8s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.center{text-align:center}
.tag{display:inline-block;background:#ffb300;color:#4e342e;font-weight:800;border-radius:12px;padding:2px 12px;font-size:.8em}
.ans{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.ans .av{font-size:42px;background:#e3f2fd;border:4px solid #90caf9;border-radius:50%;width:74px;height:74px;display:grid;place-items:center}
.ans .av.sel{background:#fff59d;border-color:#fbc02d;transform:scale(1.12)}
input.tx{font:inherit;width:100%;padding:12px;border-radius:14px;border:3px solid #90caf9;margin:6px 0}
.cert{border:10px double #f9a825;border-radius:20px;background:#fffde7;padding:22px 14px;text-align:center}
.cert h2{font-size:1.6em;color:#e65100}
.cert .nm{font-size:1.9em;font-weight:800;color:var(--biru2);border-bottom:3px dotted #f9a825;display:inline-block;padding:0 14px;margin:6px 0}
.rv{border-left:6px solid #43a047;background:#f5fbf5;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.92em}
.rv.x{border-color:#e53935;background:#fff5f5}
.scorebox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.scorebox div{background:#e3f2fd;border-radius:18px;padding:10px 18px;font-weight:800;text-align:center;min-width:110px}
.scorebox div span{display:block;font-size:1.8em;color:var(--biru2)}
.confetti span{position:fixed;top:-20px;z-index:200;font-size:26px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:16px;z-index:300;font-weight:700}
@media(max-width:560px){body{font-size:16px}.bins{grid-template-columns:1fr}.bin{min-height:90px}.node{width:76px;height:76px;font-size:32px}.tetes{width:54px}.hot{font-size:28px}}
@media print{body.pc .topbar,body.pc .sect:not(.csect),body.pc .noprint{display:none!important}body.pc #bg{display:none}body.pc .card{box-shadow:none;border:0}}

<script>
"use strict";
/* ====== Data profil (silakan ubah) ====== */
const PROFIL={dev:"Pradista Selfia, S.Pd.",inst:"Magister Pendidikan Dasar, Universitas PGRI Semarang"};

/* ====== Utilitas ====== */
const $=(s,r=document)=>r.querySelector(s);
const h=html=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="mpi-siklus-air-v1";
const S={name:"",avatar:"🧒",meter:20,stars:[0,0,0,0,0],done:[false,false,false,false,false],sound:true,zm:0};
let evalLog=[];
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(sessionStorage.getItem(KEY)||"null");if(d)Object.assign(S,d);}catch(e){}}
function toast(t){const e=h('<div class="toast">'+t+'</div>');document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}

/* ====== Suara ====== */
let ac=null;
function beep(type){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const seq=type==="ok"?[[660,.1],[880,.15]]:type==="no"?[[200,.22]]:type==="win"?[[523,.13],[659,.13],[784,.13],[1047,.25]]:[[520,.06]];
    let t=ac.currentTime;
    seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type==="no"?"sawtooth":"sine";o.frequency.value=f;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d;});
  }catch(e){}
}
function confetti(){
  const c=h('<div class="confetti"></div>');
  const em=["💧","⭐","🌈","☁️","🎉","🌱"];
  for(let i=0;i<26;i++){const s=document.createElement("span");s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*1.2+"s";c.appendChild(s);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),4800);
}

/* ====== Meter Air ====== */
function renderMeter(){
  $("#mfill").style.width=S.meter+"%";$("#mval").textContent=Math.round(S.meter)+"%";
  document.documentElement.style.setProperty("--g",((1-S.meter/100)*0.85).toFixed(2));
}
function meter(d){S.meter=Math.max(5,Math.min(100,S.meter+d));renderMeter();save();}
const hit=()=>meter(3);
const miss=()=>{S.zm++;meter(-2);};

/* ====== Tokoh Tetes ====== */
const TETES='<svg viewBox="0 0 80 100" class="tetes" aria-hidden="true"><path d="M40 4C40 4 8 44 8 64a32 32 0 0 0 64 0C72 44 40 4 40 4z" fill="#29b6f6" stroke="#0277bd" stroke-width="3"/><ellipse cx="25" cy="56" rx="6" ry="10" fill="#fff" opacity=".45" transform="rotate(15 25 56)"/><circle cx="31" cy="68" r="6" fill="#fff"/><circle cx="49" cy="68" r="6" fill="#fff"/><circle cx="32" cy="69" r="3" fill="#0d47a1"/><circle cx="50" cy="69" r="3" fill="#0d47a1"/><path d="M32 80q8 8 16 0" stroke="#0d47a1" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
function say(t){const b=$(".bubble");if(b)b.innerHTML=t;}
function expl(box,t){const e=h('<div class="explain">💡 <b>Tahukah kamu?</b> '+t+'</div>');box.appendChild(e);e.scrollIntoView({behavior:"smooth",block:"nearest"});}

/* ====== Komponen interaktif ====== */
function mcq(box,o){
  const w=h('<div class="q"><p class="qt">'+o.q+'</p><div class="opts"></div><div class="fbx"></div></div>');
  const opts=$(".opts",w),fbx=$(".fbx",w);let tries=0,fin=false;
  const list=o.shuffle===false?o.opts:shuffle(o.opts);
  list.forEach(op=>{
    const b=h('<button class="opt">'+op.t+'</button>');op.el=b;
    b.onclick=()=>{
      if(fin||b.disabled)return;tries++;
      if(op.ok){
        fin=true;b.classList.add("right");beep("ok");
        fbx.innerHTML='<div class="fb ok">✅ Benar! '+(o.explain||"")+'</div>';
        [...opts.children].forEach(x=>x.disabled=true);
        if(o.zone)hit();
        o.onDone&&o.onDone(tries===1);
      }else{
        b.classList.add("wrong");beep("no");
        if(o.retry===false){
          fin=true;const c=o.opts.find(x=>x.ok);c.el.classList.add("right");
          [...opts.children].forEach(x=>x.disabled=true);
          fbx.innerHTML='<div class="fb no">❌ Belum tepat. Jawaban yang benar: <b>'+c.t+'</b></div>';
          o.onDone&&o.onDone(false);
        }else{
          b.disabled=true;if(o.zone)miss();
          fbx.innerHTML='<div class="fb no">❌ '+(op.why||"Belum tepat.")+' Coba lagi ya!</div>';
          if(o.zone)say("Hampir! "+(op.why||"Baca lagi petunjuknya, lalu coba pilihan lain."));
        }
      }
    };
    opts.appendChild(b);
  });
  box.appendChild(w);return w;
}
function matcher(box,o){
  const w=h('<div class="match"><p class="qt">'+o.q+'</p><div class="mcols"><div class="mc L"></div><div class="mc R"></div></div><div class="fbx"></div></div>');
  const L=$(".L",w),R=$(".R",w),fbx=$(".fbx",w);let sel=null,left=o.pairs.length,errs=0;
  o.pairs.forEach((p,i)=>{
    const b=h('<button class="mi">'+p[0]+'</button>');
    b.onclick=()=>{if(b.classList.contains("lock"))return;[...L.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=i;beep("tap");};
    L.appendChild(b);
  });
  shuffle(o.pairs.map((p,i)=>i)).forEach(i=>{
    const b=h('<button class="mi">'+o.pairs[i][1]+'</button>');
    b.onclick=()=>{
      if(b.classList.contains("lock"))return;
      if(sel===null){fbx.innerHTML='<div class="fb no">Pilih dulu satu kartu di kolom kiri.</div>';return;}
      if(sel===i){
        const lb=L.children[sel];lb.classList.remove("sel");lb.classList.add("lock");b.classList.add("lock");sel=null;beep("ok");
        if(o.zone)hit();left--;fbx.innerHTML='<div class="fb ok">✅ Cocok! '+(o.pairs[i][2]||"")+'</div>';
        if(left===0){o.onDone&&o.onDone(errs===0);}
      }else{
        errs++;if(o.zone)miss();beep("no");b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),420);
        fbx.innerHTML='<div class="fb no">❌ Belum cocok. Coba pasangkan lagi.</div>';
      }
    };
    R.appendChild(b);
  });
  box.appendChild(w);return w;
}
function sorter(box,o){
  const w=h('<div class="sorter"><p class="qt">'+o.q+'</p><div class="pool"></div><div class="bins"></div><div class="fbx"></div></div>');
  const pool=$(".pool",w),bins=$(".bins",w),fbx=$(".fbx",w);let sel=null,left=o.items.length;
  function drop(chip,bin){
    const it=chip._it;
    if(it.bin===bin.dataset.bin){
      bin.querySelector(".bc").appendChild(chip);chip.classList.remove("sel","drag");chip.classList.add("placed");chip._done=true;sel=null;beep("ok");
      if(o.zone)hit();fbx.innerHTML='<div class="fb ok">✅ '+it.t+': '+it.why+'</div>';
      if(--left===0){pool.style.display="none";o.onDone&&o.onDone();}
    }else{
      if(o.zone)miss();beep("no");chip.classList.add("shake");setTimeout(()=>chip.classList.remove("shake"),420);
      fbx.innerHTML='<div class="fb no">❌ Belum tepat. '+(it.hint||"Perhatikan wujud air pada contoh itu.")+'</div>';
    }
  }
  o.bins.forEach(b=>{
    const d=h('<div class="bin" data-bin="'+b.id+'"><div class="bt">'+b.icon+' '+b.label+'</div><div class="bc"></div></div>');
    d.onclick=()=>{if(sel)drop(sel,d);};bins.appendChild(d);
  });
  shuffle(o.items).forEach(it=>{
    const c=h('<div class="chip">'+it.t+'</div>');c._it=it;
    c.addEventListener("pointerdown",e=>{
      if(c._done)return;
      const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
      try{c.setPointerCapture(e.pointerId);}catch(x){}
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=c.cloneNode(true);ghost.classList.add("ghost");document.body.appendChild(ghost);c.classList.add("drag");}
        if(ghost){ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";}
      };
      const up=ev=>{
        c.removeEventListener("pointermove",mv);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);
        if(moved){
          if(ghost)ghost.remove();c.classList.remove("drag");
          const t=document.elementFromPoint(ev.clientX,ev.clientY);const bn=t&&t.closest?t.closest(".bin"):null;
          if(bn)drop(c,bn);
        }else{[...pool.children].forEach(x=>x.classList.remove("sel"));c.classList.add("sel");sel=c;beep("tap");}
      };
      c.addEventListener("pointermove",mv);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
    });
    pool.appendChild(c);
  });
  box.appendChild(w);return w;
}
function orderer(box,o){
  const w=h('<div class="orderer"><p class="qt">'+o.q+'</p><div class="slots"></div><div class="pool"></div><div class="fbx"></div></div>');
  const slots=$(".slots",w),pool=$(".pool",w),fbx=$(".fbx",w);let next=0;
  o.steps.forEach((s,i)=>slots.appendChild(h('<div class="slot"><b>'+(i+1)+'</b><span>…</span></div>')));
  shuffle(o.steps.map((s,i)=>i)).forEach(i=>{
    const c=h('<button class="chip" style="touch-action:auto;cursor:pointer">'+o.steps[i]+'</button>');
    c.onclick=()=>{
      if(i===next){
        const sl=slots.children[next];sl.classList.add("fill");sl.querySelector("span").textContent=o.steps[i];c.remove();next++;beep("ok");
        if(o.zone)hit();fbx.innerHTML='<div class="fb ok">✅ Urutan ke-'+next+' tepat!</div>';
        if(next===o.steps.length){pool.style.display="none";o.onDone&&o.onDone();}
      }else{
        if(o.zone)miss();beep("no");c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),420);
        fbx.innerHTML='<div class="fb no">❌ Belum tepat. Kartu mana yang terjadi lebih dulu? Coba lagi.</div>';
      }
    };
    pool.appendChild(c);
  });
  box.appendChild(w);return w;
}
function modal(html){
  const m=h('<div class="modal"><div class="box">'+html+'<p class="center"><button class="btn" id="mClose">Tutup</button></p></div></div>');
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);$("#mClose",m).onclick=()=>m.remove();
}

function infoCards(box,arr,cls){
  const g=h('<div class="grid"></div>');
  arr.forEach(a=>g.appendChild(h('<div class="info '+(a.c||cls||"")+'"><span class="em">'+a.e+'</span><b class="t">'+a.t+'</b>'+a.d+'</div>')));
  box.appendChild(g);
}

       onDone:()=>{expl(box,"Ketiga siklus berbeda dalam jarak dan jalur yang ditempuh air, tetapi semuanya dimulai dari penguapan dan berakhir kembali ke laut.");ok();}});
   }
 ]},
 {name:"Desa Tirta Bermasalah",sub:"Misi menyelamatkan air",icon:"🏘️",
  narasi:"Kita tiba di Desa Tirta! Jadilah detektif air dan temukan penyebab masalahnya.",
  recap:"Kegiatan manusia seperti menebang hutan, membuang sampah dan limbah, serta boros air dapat mengganggu siklus air.",
  next:"Ada tantangan terakhir di Menara Jernih. Tunjukkan bahwa kamu layak menjadi Penjaga Air!",
  steps:CASES.map((cs,ci)=>(box,ok)=>{
    const w=h('<div><span class="tag">Kasus '+(ci+1)+'/4</span><h3>'+cs.t+'</h3><div class="ph"></div></div>');box.appendChild(w);const ph=$(".ph",w);
    function observe(){
      ph.innerHTML="";say("Amati dulu keadaan desa. Apa yang tampak janggal?");
      ph.appendChild(h('<p><span class="phase">1 Amati</span></p>'));
      ph.appendChild(h('<div class="scn">'+cs.before+'</div>'));
      ph.appendChild(h('<div class="scn bad">'+cs.bad+'</div>'));
      ph.appendChild(h('<p>'+cs.story+'</p>'));
      const nb=h('<p class="center"><button class="btn" disabled>Selidiki penyebabnya ▶</button></p>');
      if(ci===0){
        const sim=h('<div class="info"><b class="t">🔬 Simulasi: jumlah pohon di hulu</b><input type="range" min="0" max="10" value="5" id="tr"><div class="bars"><div id="b1" style="background:#0288d1">Meresap</div><div id="b2" style="background:#8d6e63">Mengalir</div></div><div id="sm" class="fb ok"></div></div>');
        ph.appendChild(sim);const seen={lo:false,hi:false};
        const upd=()=>{
          const v=+$("#tr",sim).value,r=15+v*7;
          $("#b1",sim).style.width=r+"%";$("#b2",sim).style.width=(100-r)+"%";
          $("#sm",sim).textContent="Pohon: "+v+" → Air meresap "+r+"%, mengalir deras "+(100-r)+"%. "+(v<=3?"Sungai mudah banjir dan sumur cepat kering.":v>=7?"Tanah menyerap banyak air sehingga lebih aman.":"Coba kurangi atau tambah pohonnya.");
          if(v<=2)seen.lo=true;if(v>=8)seen.hi=true;
          if(seen.lo&&seen.hi)nb.firstChild.disabled=false;
        };
        $("#tr",sim).addEventListener("input",upd);upd();
        ph.appendChild(h('<p class="fb ok">Geser sampai jumlah pohon sedikit (0–2) dan banyak (8–10) untuk membuka tombol.</p>'));
      }else{nb.firstChild.disabled=false;}
      nb.firstChild.onclick=evid;ph.appendChild(nb);
    }
    function evid(){
      ph.innerHTML="";say("Kumpulkan bukti! Pilih bukti yang menjelaskan penyebab masalah.");
      ph.appendChild(h('<p><span class="phase">2 Temukan penyebab</span></p>'));
      mcq(ph,{zone:1,q:"Bukti manakah yang paling menjelaskan penyebab masalah di desa?",opts:cs.ev,explain:"Bukti itu tepat sebagai penyebab.",onDone:()=>{const b=h('<p class="center"><button class="btn">Susun sebab-akibat ▶</button></p>');b.firstChild.onclick=chain;ph.appendChild(b);}});
    }
    function chain(){
      ph.innerHTML="";say("Susun kartu agar terbentuk rangkaian sebab-akibat.");
      ph.appendChild(h('<p><span class="phase">3 Susun sebab-akibat</span></p>'));
      orderer(ph,{zone:1,q:"Urutkan dari sebab awal sampai akibat akhir.",steps:cs.chain,onDone:()=>{const b=h('<p class="center"><button class="btn">Pilih solusi ▶</button></p>');b.firstChild.onclick=sol;ph.appendChild(b);}});
    }
    function sol(){
      ph.innerHTML="";say("Sekarang pilih solusi terbaik untuk memulihkan air desa.");
      ph.appendChild(h('<p><span class="phase">4 Pilih solusi</span></p>'));
      mcq(ph,{zone:1,q:"Tindakan apa yang paling tepat untuk mengatasi masalah ini?",opts:cs.sol,explain:"Solusi itu membantu air kembali bersiklus dengan baik.",onDone:()=>{const b=h('<p class="center"><button class="btn hijau">Lihat hasil pemulihan ▶</button></p>');b.firstChild.onclick=res;ph.appendChild(b);}});
    }
    function res(){
      ph.innerHTML="";say("Lihat! Desa Tirta pulih berkat tindakanmu.");meter(6);beep("win");
      ph.appendChild(h('<p><span class="phase">5 Hasil</span></p>'));
      ph.appendChild(h('<div class="scn good">'+cs.fix+'</div>'));
      ph.appendChild(h('<div class="fb ok">💧 Meter Air naik! Desa Tirta makin segar.</div>'));
      expl(ph,cs.fact);ok();
    }
    observe();
  })},
 {name:"Menara Jernih",sub:"Evaluasi akhir",icon:"🏰",
  narasi:"Ini ujian terakhir! Jawab 10 soal untuk mengisi menara dengan air jernih.",
  steps:EVAL.map((q,qi)=>(box,ok)=>evalQ(q,qi,box,ok))}
];

function evalQ(q,qi,box,ok){
  say("Soal "+(qi+1)+" dari "+EVAL.length+". Tetes percaya padamu!");
  box.appendChild(h('<p><span class="tag">Soal '+(qi+1)+'/10 • '+q.c+' '+q.lab+'</span></p>'));
  box.appendChild(h('<div class="prog"><div style="width:'+(qi/EVAL.length*100)+'%"></div></div>'));
  const done=f=>{evalLog[qi]={ok:f};if(f)beep("win");expl(box,q.explain);ok();};
  if(q.type==="mcq"){mcq(box,{q:q.q,opts:q.opts.map(o=>Object.assign({},o)),retry:false,explain:q.explain,onDone:done});}
  else if(q.type==="tf"){mcq(box,{q:q.q,shuffle:false,opts:[{t:"Benar",ok:q.ans},{t:"Salah",ok:!q.ans}],retry:false,explain:q.explain,onDone:done});}
  else if(q.type==="match"){matcher(box,{q:q.q,pairs:q.pairs,onDone:done});}
  else{
    const w=h('<div><p class="qt">'+q.q+'</p><div class="opts"></div><p class="center"><button class="btn">Periksa Jawaban</button></p><div class="fbx"></div></div>');
    shuffle(q.opts).forEach(o=>{const b=h('<button class="opt">'+o.t+'</button>');b._o=o;b.onclick=()=>{b.classList.toggle("sel");beep("tap");};$(".opts",w).appendChild(b);});
    $(".btn",w).onclick=function(){
      const bs=[...$(".opts",w).children];const sel=bs.filter(b=>b.classList.contains("sel"));
      if(sel.length!==3){$(".fbx",w).innerHTML='<div class="fb no">Pilih tepat 3 tindakan.</div>';return;}
      this.disabled=true;let good=true;
      bs.forEach(b=>{b.disabled=true;const s=b.classList.contains("sel");if(b._o.ok){b.classList.remove("sel");b.classList.add("right");if(!s)good=false;}else if(s){b.classList.remove("sel");b.classList.add("wrong");good=false;}});
      $(".fbx",w).innerHTML=good?'<div class="fb ok">✅ Rencana yang hebat!</div>':'<div class="fb no">❌ Belum tepat. Tindakan benar ditandai hijau.</div>';
      done(good);
    };
    box.appendChild(w);
  }
}

/* ====== Layar ====== */
const app=$("#app");
function setMode(m){document.body.className=m==="home"?"home":"inner";$("#ttl").textContent=m==="home"?"":m;window.scrollTo(0,0);renderMeter();}
function go(scr,arg){
  if(scr==="home")home();else if(scr==="mission")mission();else if(scr==="map")mapScr();else if(scr==="zone")openZone(arg);else if(scr==="result")resultScr();
}
function home(){
  setMode("home");
  const resume=S.name&&S.done.some(Boolean);
  app.innerHTML="";
  const w=h('<div class="home-wrap"><div class="home-card">'+TETES+'<h1>Petualangan Tetes Air Menjelajah Siklus Air</h1><p>IPAS • Kelas V SD • Siklus Air</p><div class="home-btns"></div><div class="home-btns"><button class="btn kuning" id="hHelp">📖 PETUNJUK</button><button class="btn kuning" id="hProf">👤 PROFIL</button><button class="btn abu" id="hSnd">'+(S.sound?"🔊 Suara: Aktif":"🔇 Suara: Mati")+'</button></div></div></div>');
  const m=h('<button class="btn hijau big">'+(resume?"▶ LANJUTKAN":"▶ MULAI")+'</button>');
  m.onclick=()=>{beep("tap");S.name?go("map"):go("mission");};
  $(".home-btns",w).appendChild(m);app.appendChild(w);
  $("#hHelp").onclick=showHelp;$("#hProf").onclick=showProfil;
  $("#hSnd").onclick=()=>{toggleSnd();$("#hSnd").textContent=S.sound?"🔊 Suara: Aktif":"🔇 Suara: Mati";};
}
function toggleSnd(){S.sound=!S.sound;$("#tSnd").textContent=S.sound?"🔊":"🔇";save();if(S.sound)beep("tap");}

}
function showProfil(){
  modal('<h2>👤 Profil Media</h2><p><b>Judul:</b> Petualangan Tetes Air Menjelajah Siklus Air<br><b>Mata pelajaran:</b> IPAS<br><b>Kelas:</b> V SD<br><b>Materi:</b> Siklus Air<br><b>Sasaran:</b> Siswa kelas V SD</p><p><b>Pengembang:</b> '+esc(PROFIL.dev)+'<br>'+esc(PROFIL.inst)+'</p>');
}
function showBag(){
  modal('<h2>🎒 Tas Petualang</h2><div class="badges">'+BADGES.map((b,i)=>'<div class="badge'+(S.done[i]?"":" off")+'"><div class="bi">'+(S.done[i]?b.i:"🔒")+'</div>'+b.n+'<br>'+(S.done[i]?"⭐".repeat(S.stars[i]):"Belum didapat")+'</div>').join("")+'</div>');
}
function mission(){
  setMode("Misi Penjaga Air");
  app.innerHTML="";
  const av=["🧒","👧","🦸","🧙"];let pick=S.avatar;
  const c=h('<div class="card"><div class="guide">'+TETES+'<div class="bubble"></div></div><p>Desa Tirta sedang dalam masalah. Sumur mengering, sungai menjadi keruh, dan hujan datang tidak teratur. Hanya Penjaga Air yang bisa mengikuti perjalanan setetes air dan memulihkan siklusnya.</p><p class="qt">Siapa namamu, Penjaga Air?</p><input class="tx" id="nm" maxlength="20" placeholder="Tulis nama panggilanmu"><p class="qt">Pilih tokohmu:</p><div class="ans"></div><p class="center"><button class="btn hijau" id="go">Terima Misi ▶</button></p></div>');

  $("#go").onclick=()=>{S.name=($("#nm").value.trim()||"Penjaga Air").slice(0,20);S.avatar=pick;save();beep("win");go("map");};

function mapScr(){
  setMode("Peta Petualangan");document.body.classList.add("map");
  const d=S.done.filter(Boolean).length;
  app.innerHTML="";
  const c=h('<div class="card"><div class="guide">'+TETES+'<div class="bubble"></div></div><h2>Peta Petualangan</h2><div class="prog"><div style="width:'+(d/5*100)+'%"></div></div><small>Misi selesai: '+d+' dari 5 zona</small><div class="map"></div><p class="center"><button class="btn kuning" id="bagB">🎒 Tas Petualang</button> <button class="btn abu" id="rst">↺ Ulangi dari Awal</button></p></div>');
  app.appendChild(c);
  say(d===5?"Hebat, "+esc(S.name)+"! Semua zona sudah kamu selesaikan. Desa Tirta kembali segar!":"Halo "+S.avatar+" <b>"+esc(S.name)+"</b>! Pilih zona yang terbuka untuk melanjutkan petualangan.");
  zones.forEach((z,i)=>{
    const locked=i>0&&!S.done[i-1];
    const row=h('<div class="nrow"><button class="node'+(locked?" lock":S.done[i]?" dn":"")+'">'+(locked?"🔒":z.icon)+(S.done[i]?'<span class="stars">'+"⭐".repeat(S.stars[i])+'</span>':"")+'</button><div class="nt"><b>Zona '+(i+1)+' – '+z.name+'</b><small>'+z.sub+'</small></div></div>');
    $(".node",row).onclick=()=>{if(locked){beep("no");toast("🔒 Selesaikan Zona "+i+" dulu ya!");}else{beep("tap");go("zone",i);}};
    $(".map",c).appendChild(row);
  });
  $("#bagB").onclick=showBag;
  $("#rst").onclick=()=>{if(confirm("Ulangi petualangan dari awal? Semua progres akan dihapus.")){Object.assign(S,{meter:20,stars:[0,0,0,0,0],done:[false,false,false,false,false],zm:0});evalLog=[];save();renderMeter();mapScr();}};
}
let Z=0,ST=0;
function openZone(i){Z=i;ST=0;S.zm=0;zoneFrame();renderStep();}
function zoneFrame(){
  const z=zones[Z];setMode("Zona "+(Z+1)+" – "+z.name);
  app.innerHTML="";
  const c=h('<div class="card"><div class="zhead"><span class="zicon">'+z.icon+'</span><div><h2>Zona '+(Z+1)+' – '+z.name+'</h2><small>'+z.sub+'</small></div></div><div class="guide" style="margin-top:10px">'+TETES+'<div class="bubble"></div></div><div class="zbody" id="zbody"></div><div class="zfoot"><button class="btn abu" id="bBack">🗺️ Peta</button><div class="dots">'+z.steps.map(()=>"<i></i>").join("")+'</div><button class="btn hijau" id="bNext" disabled>Lanjut ▶</button></div></div>');
  app.appendChild(c);
  $("#bBack").onclick=()=>go("map");
  $("#bNext").onclick=()=>{beep("tap");if(ST<z.steps.length-1){ST++;renderStep();}else finishZone();};
}
function renderStep(){
  const z=zones[Z],box=$("#zbody"),nb=$("#bNext");const my=ST;
  box.innerHTML="";nb.disabled=true;nb.classList.remove("pulse");
  nb.textContent=ST===z.steps.length-1?(Z===4?"Lihat Hasil ✔":"Selesai ✔"):"Lanjut ▶";
  [...document.querySelectorAll(".dots i")].forEach((d,k)=>{d.className=k<ST?"dn":k===ST?"on":"";});
  window.scrollTo(0,0);
  z.steps[ST](box,()=>{if(my===ST){nb.disabled=false;nb.classList.add("pulse");}});
}
function finishZone(){
  if(Z===4){resultScr();return;}
  const z=zones[Z];
  const st=S.zm===0?3:S.zm<=3?2:1;
  S.stars[Z]=Math.max(S.stars[Z],st);S.done[Z]=true;S.meter=Math.max(S.meter,30+Z*15);save();renderMeter();
  setMode("Lencana Zona "+(Z+1));beep("win");confetti();
  app.innerHTML="";
  const b=BADGES[Z];
  const c=h('<div class="card center"><div class="bigbadge">'+b.i+'</div><h2>'+b.n+'</h2><p style="font-size:1.6em">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</p><div class="explain" style="text-align:left">📘 <b>Rangkuman:</b> '+z.recap+'</div><div class="guide" style="margin-top:12px;text-align:left">'+TETES+'<div class="bubble">'+z.next+'</div></div><p><button class="btn hijau" id="nx">'+(Z<4?"Zona Berikutnya ▶":"Lanjut ▶")+'</button> <button class="btn abu" id="mp">🗺️ Ke Peta</button></p></div>');
  app.appendChild(c);
  $("#nx").onclick=()=>go("zone",Z+1);$("#mp").onclick=()=>go("map");
}
function resultScr(){
  const correct=evalLog.filter(x=>x&&x.ok).length,score=correct*10;
  const st=score>=90?3:score>=70?2:1;
  S.stars[4]=Math.max(S.stars[4],st);S.done[4]=true;S.meter=100;save();renderMeter();
  setMode("Hasil Evaluasi");beep("win");confetti();
  app.innerHTML="";
  const msg=score>=90?"Luar biasa! Kamu Penjaga Air sejati!":score>=70?"Bagus sekali! Sedikit lagi sempurna.":score>=50?"Cukup baik. Pelajari lagi bagian yang masih keliru.":"Ayo semangat! Ulangi zona sebelumnya lalu coba lagi.";
  const rv=EVAL.map((q,i)=>{
    const ok=evalLog[i]&&evalLog[i].ok;
    let key="";
    if(q.type==="mcq")key=q.opts.find(o=>o.ok).t;
    else if(q.type==="tf")key=q.ans?"Benar":"Salah";
    else if(q.type==="match")key=q.pairs.map(p=>p[0]+" → "+p[1]).join("; ");
    else key=q.opts.filter(o=>o.ok).map(o=>o.t).join("; ");
    return '<div class="rv'+(ok?"":" x")+'"><b>'+(ok?"✅":"❌")+' Soal '+(i+1)+' ('+q.c+' '+q.lab+')</b><br>'+q.q+'<br><b>Jawaban:</b> '+key+'<br><i>Pembahasan:</i> '+q.explain+'</div>';
  }).join("");
  const c=h('<div><div class="card sect center"><div class="bigbadge">'+BADGES[4].i+'</div><h2>'+BADGES[4].n+'</h2><p style="font-size:1.6em">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</p><div class="scorebox"><div><span>'+score+'</span>Skor</div><div><span>'+correct+'</span>Benar</div><div><span>'+(10-correct)+'</span>Salah</div></div><p><b>'+msg+'</b></p></div><div class="card sect"><h2>📝 Pembahasan Soal</h2>'+rv+'</div><div class="card sect csect"><div class="cert"><h2>🏆 SERTIFIKAT PENJAGA AIR 🏆</h2><p>Diberikan kepada</p><div class="nm">'+S.avatar+' '+esc(S.name)+'</div><p>karena telah menyelesaikan<br><b>Petualangan Tetes Air Menjelajah Siklus Air</b><br>IPAS Kelas V SD</p><p>Skor akhir: <b>'+score+'</b> &nbsp; '+"⭐".repeat(st)+'</p><p>Lencana: '+BADGES.map(b=>b.i).join(" ")+'</p></div></div><p class="center noprint"><button class="btn kuning" id="pr">🖨️ Cetak Sertifikat</button> <button class="btn" id="rp">↺ Ulangi Evaluasi</button> <button class="btn hijau" id="mp">🗺️ Ke Peta</button> <button class="btn abu" id="hm">🏠 Menu Utama</button></p></div>');
  app.appendChild(c);
  $("#pr").onclick=()=>{document.body.classList.add("pc");window.print();setTimeout(()=>document.body.classList.remove("pc"),500);};
  $("#rp").onclick=()=>{evalLog=[];go("zone",4);};
  $("#mp").onclick=()=>go("map");$("#hm").onclick=()=>go("home");
}
